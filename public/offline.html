<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SmartJib</title>
    <meta name="theme-color" content="#00685f" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5faf8;
        color: #171d1b;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
      }
      .badge {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: #00685f;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #3f4946;
      }
      button {
        border: 0;
        cursor: pointer;
        padding: 12px 24px;
        border-radius: 14px;
        background: #00685f;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
      }
      button:hover {
        opacity: 0.9;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1513;
          color: #dde4e1;
        }
        p {
          color: #b8c7c3;
        }
        button {
          background: #6bd8cb;
          color: #003732;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M3 8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8Z"
            fill="#e6fffb"
          />
          <path d="M21 10.5h-4a1.5 1.5 0 0 0 0 3h4v-3Z" fill="#00685f" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        SmartJib needs a connection to load your latest budget. Your data is safe — reconnect and
        everything will sync back up.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
