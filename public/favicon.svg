<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A4F48"/>
      <stop offset="1" stop-color="#0A2C28"/>
    </linearGradient>
  </defs>
  <!-- cards fanned out of the wallet: pale lime behind, lime in front -->
  <rect x="96" y="42" width="330" height="170" rx="28" fill="#D6EAC6" transform="rotate(-9 261 127)"/>
  <rect x="88" y="78" width="330" height="150" rx="28" fill="#C5E6A6" transform="rotate(-6 253 153)"/>
  <!-- wallet body -->
  <rect x="48" y="152" width="416" height="296" rx="72" fill="url(#body)"/>
  <!-- white stitched seam, as on the 3D artwork -->
  <path d="M64 200 C160 200 196 262 250 262 C304 262 340 200 448 200" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- clasp with white dot -->
  <rect x="332" y="284" width="164" height="104" rx="48" fill="#0A2C28"/>
  <circle cx="390" cy="336" r="24" fill="#FFFFFF"/>
</svg>
