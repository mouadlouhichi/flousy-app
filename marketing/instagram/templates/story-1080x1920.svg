<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">SmartJib editable Story template</title>
  <desc id="desc">A vertical Instagram Story template with clear safe areas for a headline and native sticker.</desc>
  <rect width="1080" height="1920" fill="#00685F"/>
  <circle cx="918" cy="315" r="286" fill="#008378"/>
  <text x="86" y="108" fill="#89F5E7" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-size="25" font-weight="700" letter-spacing="1">SMARTJIB / 00</text>
  <text x="86" y="150" fill="#DDF7F1" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-size="20" letter-spacing="1">STORY TOPIC</text>
  <text x="86" y="420" fill="#FFFFFF" font-family="Instrument Sans, Manrope, Arial, sans-serif" font-size="96" font-weight="800">One clear</text>
  <text x="86" y="528" fill="#FFFFFF" font-family="Instrument Sans, Manrope, Arial, sans-serif" font-size="96" font-weight="800">idea here.</text>
  <text x="90" y="618" fill="#DDF7F1" font-family="Instrument Sans, Manrope, Arial, sans-serif" font-size="32">Keep the key message in the safe area.</text>
  <rect x="86" y="850" width="908" height="485" rx="56" fill="#FFFFFF"/>
  <text x="540" y="1057" fill="#00685F" text-anchor="middle" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-size="28" font-weight="700">ADD VISUAL / SCREEN RECORDING</text>
  <text x="540" y="1108" fill="#58706A" text-anchor="middle" font-family="Instrument Sans, Manrope, Arial, sans-serif" font-size="28">or place a native poll, link or question sticker here</text>
  <rect x="86" y="1455" width="908" height="120" rx="40" fill="#DDF7F1" fill-opacity="0.18" stroke="#89F5E7" stroke-width="2" stroke-dasharray="12 12"/>
  <text x="540" y="1528" fill="#89F5E7" text-anchor="middle" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-size="21" font-weight="700">NATIVE INSTAGRAM STICKER AREA</text>
  <text x="86" y="1818" fill="#DDF7F1" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-size="22">smartjib.app</text>
  <!-- Keep vital text roughly within y=250 to y=1650. -->
</svg>
