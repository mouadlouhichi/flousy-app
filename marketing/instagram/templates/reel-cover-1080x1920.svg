<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">SmartJib editable Reel cover template</title>
  <desc id="desc">A friendly Reel cover with readable central content and room for a play motif.</desc>
  <style>
    .latin { font-family: Inter, "Inter Variable", Arial, sans-serif; }
    .arabic { font-family: Cairo, "Noto Sans Arabic", sans-serif; }
    .eyebrow { font-size: 27px; font-weight: 700; letter-spacing: 1.2px; }
    .latin-display { font-family: "Inter SemiBold", Inter, Arial, sans-serif; }
    .arabic-display { font-family: "Cairo ExtraBold", Cairo, "Noto Sans Arabic", sans-serif; }
    .headline { font-size: 112px; font-weight: 600; letter-spacing: -2px; }
    .body { font-size: 33px; font-weight: 520; }
    .label { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  </style>
  <rect width="1080" height="1920" fill="#F3F7F3"/>
  <circle cx="910" cy="312" r="290" fill="#C5E6A6"/>
  <path d="M 822 289 L 840 326 L 878 344 L 840 362 L 822 400 L 804 362 L 766 344 L 804 326 Z" fill="#A9D383"/>
  <text x="82" y="118" fill="#0F3B36" class="latin eyebrow">SMARTJIB</text>
  <rect x="290" y="91" width="98" height="40" rx="20" fill="#E3F0E6"/>
  <text x="315" y="119" fill="#0F3B36" class="latin label">REEL</text>
  <text x="82" y="159" fill="#5B6B63" class="latin label">SUJET · MAD</text>
  <text x="82" y="406" fill="#0E1A17" class="latin-display headline">Ton hook</text>
  <text x="82" y="522" fill="#0E1A17" class="latin-display headline">ici.</text>
  <rect x="82" y="896" width="916" height="420" rx="62" fill="#0F3B36" transform="translate(13 14)" opacity=".18"/>
  <rect x="72" y="882" width="936" height="420" rx="62" fill="#0F3B36"/>
  <text x="122" y="958" fill="#C5E6A6" class="latin label">UNE PROMESSE SIMPLE</text>
  <text x="122" y="1068" fill="#FFFFFF" class="latin body" style="font-size:55px;font-weight:700">Explique le bénéfice</text>
  <text x="122" y="1136" fill="#FFFFFF" class="latin body" style="font-size:55px;font-weight:700">sans le sur-vendre.</text>
  <circle cx="818" cy="1090" r="108" fill="#C5E6A6"/>
  <!-- Lucide: Play -->
  <svg x="708" y="980" width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="#0F3B36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Play icon" role="img">
    <polygon points="6 3 20 12 6 21 6 3"/>
  </svg>
  <text x="82" y="1823" fill="#5B6B63" class="latin label">smartjib.space</text>
  <!-- Keep title inside the central 4:5 crop-safe area. Use Cairo for every Arabic/Darija line, and add native captions to the Reel. -->
</svg>
