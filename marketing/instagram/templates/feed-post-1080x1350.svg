<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">SmartJib Morocco-first editable feed template</title>
  <desc id="desc">Warm cream portrait feed template with a friendly headline, a rounded information card, and a logo placeholder.</desc>
  <style>
    .latin { font-family: "Instrument Sans", "Instrument Sans Variable", Manrope, Arial, sans-serif; }
    .arabic { font-family: Cairo, "Noto Sans Arabic", sans-serif; }
    .eyebrow { font-size: 24px; font-weight: 720; letter-spacing: 1.2px; }
    .headline { font-size: 104px; font-weight: 800; letter-spacing: -2px; }
    .body { font-size: 31px; font-weight: 520; }
    .label { font-size: 20px; font-weight: 720; letter-spacing: 1px; }
  </style>
  <rect width="1080" height="1350" fill="#FFF9F1"/>
  <circle cx="924" cy="188" r="252" fill="#F8DAD2"/>
  <path d="M 825 210 L 842 246 L 878 263 L 842 280 L 825 316 L 808 280 L 772 263 L 808 246 Z" fill="#E9B35C"/>
  <text x="82" y="101" fill="#006B62" class="latin eyebrow">SMARTJIB</text>
  <rect x="252" y="76" width="86" height="36" rx="18" fill="#DDF6EF"/>
  <text x="276" y="102" fill="#006B62" class="latin label">00</text>
  <text x="82" y="139" fill="#5E716B" class="latin label">PILIER · MAD</text>
  <text x="82" y="312" fill="#172622" class="latin headline">Ton idée,</text>
  <text x="82" y="408" fill="#172622" class="latin headline">sans pression.</text>
  <text x="82" y="474" fill="#5E716B" class="latin body">Une ligne de soutien, simple et locale.</text>
  <rect x="82" y="608" width="916" height="456" rx="58" fill="#006B62" transform="translate(12 14)" opacity=".18"/>
  <rect x="72" y="594" width="936" height="456" rx="58" fill="#FFFFFF" stroke="#D6E4DE" stroke-width="2"/>
  <text x="122" y="664" fill="#006B62" class="latin label">UNE INFORMATION UTILE</text>
  <text x="122" y="762" fill="#172622" class="latin body" style="font-size:46px;font-weight:780">Garde la carte claire.</text>
  <text x="122" y="821" fill="#5E716B" class="latin body">Une explication courte vaut mieux qu’un mur de texte.</text>
  <rect x="122" y="875" width="490" height="26" rx="13" fill="#9CE9DB"/>
  <rect x="122" y="920" width="650" height="26" rx="13" fill="#DDF6EF"/>
  <circle cx="850" cy="932" r="96" fill="#DDF6EF"/>
  <text x="850" y="943" text-anchor="middle" fill="#006B62" class="latin label">LOGO</text>
  <text x="82" y="1272" fill="#5E716B" class="latin label">smartjib.app</text>
  <!-- Use Instrument Sans for French/Latin and Cairo for Arabic. Replace LOGO with ../brand/smartjib-logo-mark-transparent.png. -->
</svg>
