name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Lint, normal and strict typecheck, and unit tests
        run: npm run check

      - name: Firestore authorization and transaction rules
        # The emulator's own report is the only place a rules mistake shows up,
        # so a failure is copied into the job summary: the Actions log blob is
        # not always reachable, the summary always is.
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-/tmp}/rules-test.log"
          # Firestore evaluates a whole request against 1000 expressions and answers
          # an over-budget write with a plain permission-denied, so the estimated
          # cost of the heaviest rules is recorded on every run - the emulator
          # refuses to say which rule asked for too much.
          {
            echo "### Estimated rules expression budget"
            echo
            echo '```'
            node scripts/rules-budget.mjs firestore.rules 6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if npx --yes firebase-tools@15 emulators:exec --only firestore --project smartjib-rules-test "npm run test:rules" 2>&1 | tee "$log"; then
            exit 0
          fi
          {
            echo "### Firestore rules suite failed - last 200 lines"
            echo
            echo '```'
            tail -n 200 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The job summary is only readable in the UI, and the log blob is not always
          # reachable at all, so the parts that decide what to fix next are published as
          # annotations: which tests failed, and whether a denial was a clean one or an
          # aborted evaluation. "Null value error" means a rule read a property a stored
          # document may never have had; "exceeded the limit" means the ruleset outgrew
          # the per-request expression budget. Both are rules bugs, not test bugs.
          # TAP indents nested results and the reporter may or may not add " - ",
          # so both shapes are matched, and the raw line is what gets published.
          grep -nE "not ok [0-9]+" "$log" | head -n 25 \
            | while IFS= read -r line; do
                printf '::error title=Firestore rules test::%s\n' "${line//$'\r'/}"
              done || true
          printf '::error title=Firestore rules failure class::%s\n' \
            "$(printf 'aborted evaluations (null value): %s; over expression budget: %s; bare denials: %s' \
              "$(grep -c 'Null value error' "$log" || true)" \
              "$(grep -c 'exceeded the limit' "$log" || true)" \
              "$(grep -c 'Missing or insufficient permissions' "$log" || true)")"
          printf '::error title=Firestore rules totals::%s\n' \
            "$(grep -E "^# (tests|pass|fail)" "$log" | tr '\n' ' ' || true)"
          exit 1

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:000000000000000000000'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Deliberately NO NEXT_PUBLIC_FIREBASE_* here: the specs exercise demo
      # mode and the truthful contact-form fallback, both of which require an
      # unconfigured environment (see e2e/README.md).
      - name: Browser E2E
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-rules:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firestore rules and indexes
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" --non-interactive

      # A silent skip here once left production rules several contracts behind
      # the client (every budget write 403'd). On main, an unconfigured deploy
      # must fail the build, not report success.
      - name: Fail loudly when the rules deploy is unconfigured
        if: github.ref == 'refs/heads/main' && (env.FIREBASE_SERVICE_ACCOUNT == '' || env.FIREBASE_PROJECT_ID == '')
        run: |
          echo "::error::Firestore rules were NOT deployed: configure the FIREBASE_SERVICE_ACCOUNT repository secret and the NEXT_PUBLIC_FIREBASE_PROJECT_ID repository variable (Settings → Secrets and variables → Actions). Deployed rules that lag the client write contract reject every budget write with 403."
          exit 1
