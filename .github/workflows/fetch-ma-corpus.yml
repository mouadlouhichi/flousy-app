name: Fetch Moroccan product corpus

# Manual data audit helper: the sandbox has no outbound access to
# openfoodfacts.org, so this runs the fetch script in Actions and hands back
# the raw corpus as an artifact. Not part of the app's CI.
on:
  # Push-triggered (not workflow_dispatch) so the audit can be re-run from a
  # working branch: touching the fetcher re-runs the harvest.
  push:
    branches: ['**']
    paths:
      - 'scripts/fetch-ma-corpus.mjs'
      - '.github/workflows/fetch-ma-corpus.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 'off (food) or obf (cosmetics)'
        required: false
        default: 'off'
      pages:
        description: 'Pages of 100 products'
        required: false
        default: '20'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/fetch-ma-corpus.mjs --source=${{ inputs.source || 'off' }} --pages=${{ inputs.pages || '20' }} 2>&1 | tee data/harvest.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-corpus-${{ inputs.source || 'off' }}
          path: data/ma-corpus-${{ inputs.source || 'off' }}.json
      # Artifact storage is not reachable from the dev sandbox, so the snapshot
      # is committed to the working branch and dropped again after the audit.
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ma-corpus-${{ inputs.source || 'off' }}.json data/harvest.log
          git diff --cached --quiet || git commit -m "chore: temporary Moroccan corpus snapshot"
          git push
