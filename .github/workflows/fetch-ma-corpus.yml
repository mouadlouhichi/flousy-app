name: Fetch Moroccan product corpus

# Manual data audit helper: the dev sandbox has no outbound access to
# openfoodfacts.org, so this harvests the corpus in Actions and publishes it
# as a public gist (the only channel readable from the sandbox). Not part of
# the app's CI.
on:
  push:
    branches: ['**']
    paths:
      - 'scripts/fetch-ma-corpus.mjs'
      - '.github/workflows/fetch-ma-corpus.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 'off (food) or obf (cosmetics)'
        required: false
        default: 'off'
      pages:
        description: 'Pages of 100 products'
        required: false
        default: '20'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/fetch-ma-corpus.mjs --source=${{ inputs.source || 'off' }} --pages=${{ inputs.pages || '20' }} 2>&1 | tee data/harvest.log
      - run: node scripts/split-corpus.mjs data/ma-corpus-${{ inputs.source || 'off' }}.json --per=400
      # Gist files are returned inline by the API only while under ~1 MB, so the
      # corpus is published in parts and reassembled on the other side.
      - name: Publish the corpus as a public gist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          for f in data/parts/part-*.json; do
            name=$(basename "$f")
            args+=(-f "files[$name][content]=$(cat "$f")")
          done
          url=$(gh api --method POST /gists -f public=true -f description="flousy-ma-corpus" "${args[@]}" --jq .html_url)
          echo "published $url"
